<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MOONTERMUX</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="dots">
      <span class="red"></span>
      <span class="yellow"></span>
      <span class="green"></span>
    </div>

    <div class="title">MOONTERMUX</div>

    <div class="version">v1.0</div>
  </div>

  <div class="terminal" id="terminal">
    
    <div class="line">> initializing shell...</div>
    <div class="line">> loading moon kernel...</div>
    <div class="line">> system ready.</div>

    <div id="output"></div>

    <div class="input-line">
      <span class="prompt">tex@moon:~ ></span>

      <input 
        type="text" 
        id="commandInput"
        autofocus
        autocomplete="off"
      >
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
